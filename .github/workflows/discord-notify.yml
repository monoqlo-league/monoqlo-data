# 戦績CSVが更新されたら Discord のチャンネルへ通知する。
# 通知先は、リポジトリの Secrets に登録した DISCORD_WEBHOOK_URL。
name: Discordへ更新を通知

on:
  push:
    branches: [main]
    paths:
      - "[0-9][0-9][0-9][0-9][0-9][0-9].csv"
      - "summary/[0-9][0-9][0-9][0-9][0-9][0-9]-summary.csv"
  # 「Actions」タブから手動でテスト送信できる
  workflow_dispatch:

concurrency:
  group: discord-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 通知を送る
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/ranking/
        run: python3 .github/notify-discord.py
